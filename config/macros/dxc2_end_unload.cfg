# Add DXC2_END_UNLOAD, then replace the stock BOX_END and BOX_END_PRINT lines
# inside END_PRINT with a single DXC2_END_UNLOAD call.  Keep the rest of your
# firmware-matched END_PRINT macro unchanged.

[gcode_macro DXC2_END_UNLOAD]
description: Complete the proven CFS unload sequence before end-of-print cleanup
gcode:
  {% set box_enabled = printer.box.enable|default(0)|int %}
  {% set box_filament = printer.box.filament|default(0)|int %}
  {% set filament_present = printer["filament_switch_sensor filament_sensor"].filament_detected %}
  {% if box_enabled == 1 and box_filament == 1 and filament_present %}
    {action_respond_info("DXC2 end unload: heat, cut, retract, and park")}
    BOX_QUIT_MATERIAL
    M400
  {% else %}
    {action_respond_info("DXC2 end unload: no CFS filament detected; skipping mechanical unload")}
  {% endif %}
  BOX_END
  BOX_END_PRINT

# END_PRINT integration point:
#
#   END_PRINT_Z_SAFE
#   DXC2_END_UNLOAD
#   Qmode_exit
