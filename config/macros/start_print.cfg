# Replace the existing START_PRINT section and add the helper below.
# These macros depend on the stock K2/CFS macros named in the body.

[gcode_macro START_PRINT]
variable_prepare: 0
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(260)|float %}
  BEACON_MCU_GUARD ENABLE=0
  BOX_START_PRINT
  _CODEX_START_PRINT_AFTER_BOX BED_TEMP={BED_TEMP} EXTRUDER_TEMP={EXTRUDER_TEMP}

[gcode_macro _CODEX_START_PRINT_AFTER_BOX]
description: Re-evaluate preparation and active mesh after the CFS preflight completes
gcode:
  G90
  SET_GCODE_OFFSET Z=0
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(260)|float %}
  {% set EXTRUDER_WAITTEMP = 140 %}
  {% set prepared = printer['gcode_macro START_PRINT'].prepare|int %}
  {% set mesh_active = printer.bed_mesh.profile_name|default('')|string|length > 0 %}
  {% if prepared == 0 or not mesh_active %}
    {% if prepared != 0 and not mesh_active %}
      {action_respond_info("Prepared flag set without an active mesh; running full preparation")}
      PRINT_PREPARE_CLEAR
    {% endif %}
    M106 S0 F1
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_WAITTEMP}
    SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000
    G28
    NOZZLE_CLEAR
    M104 S{EXTRUDER_WAITTEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_WAITTEMP}
    BOX_NOZZLE_CLEAN
    NEXT_HOMEZ_NACCU
    G28 Z
    Z_TILT_ADJUST WAITTIME=5
    G28 Z
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE=kamp
  {% else %}
    PRINT_PREPARE_CLEAR
  {% endif %}
  M140 S{BED_TEMP}
  M104 S{EXTRUDER_TEMP}
  BOX_GO_TO_EXTRUDE_POS
  M190 S{BED_TEMP}
  M109 S{EXTRUDER_TEMP}
  M220 S100
  G21
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10
  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  BOX_NOZZLE_CLEAN
  G92 E0
  SET_PIN PIN=extruder_fan VALUE=1
  BEACON_MCU_GUARD ENABLE=1
