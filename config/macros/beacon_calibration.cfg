# Replace firmware-matched macro sections with the corresponding sections
# below.  These depend on the K2's stock CFS, temperature, and save macros.

[gcode_macro G29]
description: Full-bed Beacon calibration with Z tilt
gcode:
  {% set bed_temp = params.BED_TEMP|default(printer.custom_macro.default_bed_temp)|float %}
  {% set extruder_temp = printer.custom_macro.g28_ext_temp|float %}
  {% set probe_count = params.PROBE_COUNT|default("31,31") %}
  {% set enabled = printer["filament_switch_sensor filament_sensor"].enabled %}
  BEACON_MCU_GUARD ENABLE=0
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% endif %}
  M104 S{extruder_temp}
  M140 S{bed_temp}
  G28
  BOX_GO_TO_EXTRUDE_POS
  BOX_NOZZLE_CLEAN
  M190 S{bed_temp}
  M109 S{extruder_temp}
  G28 Z
  BED_MESH_CLEAR
  Z_TILT_ADJUST WAITTIME=5
  G28 Z
  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  BED_MESH_CALIBRATE ADAPTIVE=0 PROBE_COUNT={probe_count} PROFILE=default
  G1 Z175 F1200
  BOX_MOVE_TO_SAFE_POS
  CXSAVE_CONFIG
  TURN_OFF_HEATERS
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  {% endif %}

[gcode_macro BED_MANUAL_CAL_START]
gcode:
  {action_respond_info("bed manual calibration start")}

[gcode_macro BED_MANUAL_CAL_END]
gcode:
  {action_respond_info("bed manual calibration end")}

[gcode_macro BED_MANUAL_CAL]
description: Recalibrate Beacon and Z tilt after manual bed adjustment
gcode:
  BED_MANUAL_CAL_START
  BEACON_MCU_GUARD ENABLE=0
  G28
  BED_MESH_CLEAR
  BEACON_TOUCH_HOME
  Z_TILT_ADJUST WAITTIME=5
  G28 Z
  TURN_OFF_HEATERS
  BED_MANUAL_CAL_END

[gcode_macro BED_MESH_CALIBRATE_START_PRINT]
description: K2 pre-print adaptive Beacon mesh
gcode:
  {% if 'PROBE_COUNT' in params|upper %}
    {% set get_count = ('PROBE_COUNT=' + params.PROBE_COUNT) %}
  {% else %}
    {% set get_count = "" %}
  {% endif %}
  {% if 'GCODE_FILE' in params|upper %}
    {% set get_gcode_file = ("GCODE_FILE='" + params.GCODE_FILE + "'") %}
  {% else %}
    {% set get_gcode_file = "" %}
  {% endif %}
  {% set bed_temp = printer.custom_macro.default_bed_temp %}
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% if 'BED_TEMP' in params|upper and params.BED_TEMP|default(0)|int >= printer.custom_macro.default_bed_temp %}
    {% set bed_temp = params.BED_TEMP %}
  {% endif %}
  {% set enabled = printer["filament_switch_sensor filament_sensor"].enabled %}
  BEACON_MCU_GUARD ENABLE=0
  M106 S0 F1
  M104 S{extruder_temp}
  M140 S{bed_temp}
  {% if "z" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% endif %}
  M190 S{bed_temp}
  M109 S{extruder_temp}
  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %}
    PRINT_PREPARED
    BED_MESH_CLEAR
    BOX_GO_TO_EXTRUDE_POS
    BOX_NOZZLE_CLEAN
    G28 Z
    Z_TILT_ADJUST WAITTIME=5
    G28 Z
  {% endif %}
  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE=kamp {get_count} {get_gcode_file}
  G0 Z10 F600
  CXSAVE_CONFIG
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  {% endif %}
