# K2 Plus Beacon RevH configuration.
# The K2 retains Creality's XY homing override and CFS/nozzle-cleaning flow.
# _HOME_Z in sensorless.cfg selects Contact when Z is unhomed and proximity
# after the Contact model exists.

[beacon]
serial: /dev/cartographer
# Measured mount geometry: the Beacon coil center is directly in line with
# the nozzle in X and 25.703 mm forward of it.  K2 coordinates increase
# toward the rear, therefore "forward" is negative Y.  The measured 2.6 mm
# vertical separation is learned by BEACON_AUTO_CALIBRATE and must not be
# entered as a conventional fixed probe z_offset.
x_offset: 0
y_offset: -25.703
mesh_main_direction: x
mesh_runs: 2
default_probe_method: proximity
accel_enable: False
contact_max_hotend_temperature: 180
contact_activate_gcode: _BEACON_CONTACT_PRE_Z
contact_deactivate_gcode: _BEACON_CONTACT_POST_Z
contact_sensitivity: 1
contact_latency_min: 3
autocal_tolerance: 0.006
# Maximum value accepted by current upstream Beacon.  Required on the K2's
# userspace USB bridge to avoid false multi-MCU trsync expirations.
trsync_timeout: 0.25
# Reduce full-rate host processing load on Creality's 32-bit ARM computer.
# Firmware contact/homing detection remains at the Beacon's native rate.
stream_sample_decimation: 8

[gcode_macro _BEACON_CONTACT_PRE_Z]
gcode:
  G4 P0

[gcode_macro _BEACON_CONTACT_POST_Z]
gcode:
  G4 P0

[gcode_macro BEACON_TOUCH_HOME]
description: Clean the nozzle and perform a fresh Beacon Contact Z home/model calibration
gcode:
  BEACON_MCU_GUARD ENABLE=0
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes %}
    # Establish the K2's absolute Z position at its lower optical switches.
    # This avoids making a full-height 3 mm/s Contact move from an unknown
    # bed position after a restart.
    ZDOWN
  {% endif %}
  BOX_GO_TO_EXTRUDE_POS
  BOX_NOZZLE_CLEAN
  G90
  G0 X175 Y175 F12000
  G0 Z20 F1800
  M400
  BEACON_AUTO_CALIBRATE
  G0 Z5 F1800

# Compatibility shims for Creality UI/macros whose original implementations
# were supplied by the removed [prtouch_v3] module.
[gcode_macro NEXT_HOMEZ_NACCU]
gcode:
  G4 P0

[gcode_macro NOZZLE_CLEAR]
gcode:
  G4 P0

[gcode_macro ACCURATE_HOME_Z]
gcode:
  BEACON_TOUCH_HOME
