# Codex CFS loader helper for Creality K2 Plus.
# Orca's built-in T0/T1/T2/T3 commands are already registered by the firmware,
# so the slicer start G-code calls this helper with a physical bay name.

# The vendor T0-T3 commands cut filament before CFS retraction.  During the
# 2026-09-23 in-print PCTG change, the slicer left the nozzle at 240 C and the
# vendor command began cutting immediately after changing its target to 250 C.
# The successful cancel/unload path heated first.  Match that order for every
# in-print tool selection while filament is still in the toolhead.
[gcode_macro _DXC2_PREPARE_TOOLCHANGE]
description: Heat the loaded filament before a CFS toolchange cut.
gcode:
  {% if printer.box.enable|int == 1 and printer["filament_switch_sensor filament_sensor"].filament_detected %}
    M400
    BOX_SET_TEMP
    _DXC2_WAIT_TOOLCHANGE_TEMP
  {% endif %}

[gcode_macro _DXC2_WAIT_TOOLCHANGE_TEMP]
description: Wait for the temperature selected by BOX_SET_TEMP before cutting.
gcode:
  {% set target = printer.extruder.target|float %}
  {% if target < 170 %}
    {action_raise_error("DXC2 toolchange aborted: BOX_SET_TEMP did not select a safe nozzle target")}
  {% endif %}
  {action_respond_info("DXC2 toolchange: waiting for nozzle %.1f C before cutter stroke" % (target - 2.0))}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target - 2.0}
  M400

# Central cutter wrapper.  Every normal CFS cut that calls BOX_CUT_MATERIAL
# now receives two full cutter strokes separated by a 50 mm X clearance move.
[gcode_macro BOX_CUT_MATERIAL]
rename_existing: BOX_CUT_MATERIAL_SINGLE
description: DXC2 double cut with a 50 mm actuator-clearance move.
gcode:
  _DXC2_DOUBLE_CUT

[gcode_macro _DXC2_DOUBLE_CUT]
description: Two normal cutter strokes separated by 50 mm of X clearance.
gcode:
  {% set box_cfg = printer.configfile.settings.box %}
  {% set cut_x = box_cfg.cut_pos_x|float %}
  {% set cut_y = box_cfg.cut_pos_y|float %}
  {% set clear_x = cut_x + 50.0 %}
  {% set velocity = box_cfg.cut_velocity|float %}
  {% if "xy" not in printer.toolhead.homed_axes %}
    {action_raise_error("DXC2 double cut requires homed X and Y axes")}
  {% endif %}
  SAVE_GCODE_STATE NAME=DXC2_DOUBLE_CUT_STATE
  {action_respond_info("DXC2 double cut: stroke 1, clear to X%.2f, stroke 2" % clear_x)}
  BOX_CUT_MATERIAL_SINGLE
  M400
  G90
  G1 X{clear_x} Y{cut_y} F{velocity}
  M400
  BOX_CUT_MATERIAL_SINGLE
  M400
  G4 P400
  RESTORE_GCODE_STATE NAME=DXC2_DOUBLE_CUT_STATE MOVE=0

# Recovery uses the raw cutter move because the vendor BOX_CUT_MATERIAL
# command can short-circuit when the toolhead filament sensor is already clear.
[gcode_macro _DXC2_DOUBLE_CUT_FORCE]
description: Force two raw cutter strokes even when the filament sensor is clear.
gcode:
  {% set box_cfg = printer.configfile.settings.box %}
  {% set cut_x = box_cfg.cut_pos_x|float %}
  {% set cut_y = box_cfg.cut_pos_y|float %}
  {% set clear_x = cut_x + 50.0 %}
  {% set velocity = box_cfg.cut_velocity|float %}
  {% if "xy" not in printer.toolhead.homed_axes %}
    {action_raise_error("DXC2 forced double cut requires homed X and Y axes")}
  {% endif %}
  SAVE_GCODE_STATE NAME=DXC2_FORCE_DOUBLE_CUT_STATE
  {action_respond_info("DXC2 forced double cut: stroke 1, clear to X%.2f, stroke 2" % clear_x)}
  BOX_MOVE_TO_CUT
  M400
  G90
  G1 X{clear_x} Y{cut_y} F{velocity}
  M400
  BOX_MOVE_TO_CUT
  M400
  G4 P400
  RESTORE_GCODE_STATE NAME=DXC2_FORCE_DOUBLE_CUT_STATE MOVE=0

# Arm one bounded use of Creality's native retrude-error recovery.  Successful
# retractions disarm this immediately.  A key865-style pause gets one automatic
# RESUME, which calls BOX_ERROR_RESUME_PROCESS; a second failure stays paused.
[gcode_macro BOX_RETRUDE_MATERIAL]
rename_existing: BOX_RETRUDE_MATERIAL_SINGLE
description: CFS retract with one bounded automatic error retry.
gcode:
  _DXC2_ARM_RETRUDE_RETRY
  BOX_RETRUDE_MATERIAL_SINGLE
  _DXC2_DISARM_RETRUDE_RETRY

[gcode_macro _DXC2_RETRUDE_RETRY_STATE]
variable_armed: 0
variable_attempts: 0
gcode:
  {action_respond_info("DXC2 retrude watchdog state: armed=%d attempts=%d" % (printer["gcode_macro _DXC2_RETRUDE_RETRY_STATE"].armed|int, printer["gcode_macro _DXC2_RETRUDE_RETRY_STATE"].attempts|int))}

[gcode_macro _DXC2_ARM_RETRUDE_RETRY]
description: Arm the retrude watchdog around one CFS retract operation.
gcode:
  SET_GCODE_VARIABLE MACRO=_DXC2_RETRUDE_RETRY_STATE VARIABLE=armed VALUE=1
  SET_GCODE_VARIABLE MACRO=_DXC2_RETRUDE_RETRY_STATE VARIABLE=attempts VALUE=0
  UPDATE_DELAYED_GCODE ID=DXC2_RETRUDE_RETRY_WATCHDOG DURATION=72

[gcode_macro _DXC2_DISARM_RETRUDE_RETRY]
description: Disarm the retrude watchdog after a successful CFS retract.
gcode:
  SET_GCODE_VARIABLE MACRO=_DXC2_RETRUDE_RETRY_STATE VARIABLE=armed VALUE=0
  UPDATE_DELAYED_GCODE ID=DXC2_RETRUDE_RETRY_WATCHDOG DURATION=0

[delayed_gcode DXC2_RETRUDE_RETRY_WATCHDOG]
gcode:
  {% set armed = printer["gcode_macro _DXC2_RETRUDE_RETRY_STATE"].armed|int %}
  {% set attempts = printer["gcode_macro _DXC2_RETRUDE_RETRY_STATE"].attempts|int %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  {% set filament_present = printer["filament_switch_sensor filament_sensor"].filament_detected %}
  {% set resume_error = printer.pause_resume.resume_err|string|lower %}
  {% set has_resume_error = resume_error not in ['', 'none', 'false'] %}
  {% if armed == 1 %}
    {% if print_state == 'paused' and filament_present and has_resume_error %}
      {% if attempts == 0 %}
        {action_respond_info("DXC2 retrude watchdog: first withdrawal failed; running one automatic firmware retry")}
        SET_GCODE_VARIABLE MACRO=_DXC2_RETRUDE_RETRY_STATE VARIABLE=attempts VALUE=1
        UPDATE_DELAYED_GCODE ID=DXC2_RETRUDE_RETRY_WATCHDOG DURATION=90
        RESUME
      {% else %}
        {action_respond_info("DXC2 retrude watchdog: automatic retry exhausted; leaving the print paused for inspection")}
        SET_GCODE_VARIABLE MACRO=_DXC2_RETRUDE_RETRY_STATE VARIABLE=armed VALUE=0
      {% endif %}
    {% elif print_state == 'printing' and attempts == 1 %}
      {action_respond_info("DXC2 retrude watchdog: automatic retry recovered; watchdog cleared")}
      SET_GCODE_VARIABLE MACRO=_DXC2_RETRUDE_RETRY_STATE VARIABLE=armed VALUE=0
    {% elif print_state in ['printing', 'paused'] %}
      UPDATE_DELAYED_GCODE ID=DXC2_RETRUDE_RETRY_WATCHDOG DURATION=15
    {% else %}
      SET_GCODE_VARIABLE MACRO=_DXC2_RETRUDE_RETRY_STATE VARIABLE=armed VALUE=0
    {% endif %}
  {% endif %}

[gcode_macro T0]
rename_existing: T0.1
gcode:
  _DXC2_PREPARE_TOOLCHANGE
  CODEX_CFS_SELECT SLOT=T1A

[gcode_macro T1]
rename_existing: T1.1
gcode:
  _DXC2_PREPARE_TOOLCHANGE
  CODEX_CFS_SELECT SLOT=T1B

[gcode_macro T2]
rename_existing: T2.1
gcode:
  _DXC2_PREPARE_TOOLCHANGE
  CODEX_CFS_SELECT SLOT=T1C

[gcode_macro T3]
rename_existing: T3.1
gcode:
  _DXC2_PREPARE_TOOLCHANGE
  CODEX_CFS_SELECT SLOT=T1D

[gcode_macro CODEX_CFS_SELECT]
description: Load the requested Creality CFS bay from slicer T commands.
variable_current_tool: ""
gcode:
  {% set slot = params.SLOT|string %}
  {% set current = printer["gcode_macro CODEX_CFS_SELECT"].current_tool|string %}
  {% set detected = printer["filament_switch_sensor filament_sensor"].filament_detected %}
  {% set active_bay = printer.box.T1.filament|string %}
  {% set active_slot = ("T1" ~ active_bay) if active_bay in ["A", "B", "C", "D"] else "" %}
  {% if (current == slot or active_slot == slot) and detected %}
    {action_respond_info("Codex CFS " ~ slot ~ " already loaded; skipping duplicate T command")}
  {% else %}
    {action_respond_info("Codex CFS loading " ~ slot)}
    BOX_ENABLE_CFS_PRINT ENABLE=1
    BOX_LOAD_MATERIAL_HEATING
    BOX_LOAD_MATERIAL_CUT_MATERIAL
    BOX_LOAD_MATERIAL_RETRUDE_MATERIAL
    BOX_LOAD_MATERIAL_EXTRUDE_MATERIAL TNN={slot}
    BOX_LOAD_MATERIAL_MATERIAL_FLUSH TNN={slot}
    BOX_LOAD_MATERIAL_END
    M400
    SET_GCODE_VARIABLE MACRO=CODEX_CFS_SELECT VARIABLE=current_tool VALUE='"{slot}"'
  {% endif %}

[gcode_macro CODEX_REQUIRE_FILAMENT]
description: Cancel before purge/print if CFS did not put filament in the toolhead.
gcode:
  {% set detected = printer["filament_switch_sensor filament_sensor"].filament_detected %}
  {% if detected %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    {action_respond_info("Codex filament detected after CFS load")}
  {% else %}
    {action_respond_info("Codex CFS load failed: filament sensor is empty; cancelling before purge")}
    M104 S0
    M140 S0
    CANCEL_PRINT
  {% endif %}
